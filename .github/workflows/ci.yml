name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest pytest-cov ruff pyright pip-audit

      - name: Verify wordlists packaged
        run: python -c "import os,keris.modules.discovery as d; assert os.path.isfile(os.path.join(d.DATA_DIR,'dirs.txt')), 'dirs.txt missing'; print('wordlists OK')"

      - name: Smoke test install
        run: |
          keris --version
          keris --help >/dev/null

      - name: Lint with ruff
        run: ruff check keris tests

      - name: Type check with pyright
        if: ${{ matrix.python-version == '3.11' }}
        run: pyright keris/cli

      - name: Run tests with coverage
        run: |
          pytest tests -q --ignore=tests/test_browser.py \
            --cov=keris --cov-report=term-missing --cov-fail-under=40

      - name: Dependency audit
        if: ${{ matrix.python-version == '3.11' }}
        run: pip-audit || true

  build:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build
        run: python -m pip install build
      - name: Build wheel + sdist
        run: python -m build