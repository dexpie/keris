name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest ruff

      - name: Verify wordlists packaged
        run: python -c "import os,keris.modules.discovery as d; assert os.path.isfile(os.path.join(d.DATA_DIR,'dirs.txt')), 'dirs.txt missing'; print('wordlists OK')"

      - name: Lint with ruff
        run: ruff check keris tests

      - name: Run tests
        run: pytest tests -q

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build
        run: python -m pip install build
      - name: Build wheel + sdist
        run: python -m build
