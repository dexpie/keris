[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keris-toolkit"
version = "0.7.0"
description = "Modular web penetration testing toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Keris Contributors" }]
keywords = ["pentest", "security", "recon", "scanner", "web", "bugbounty", "cve"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Environment :: Console",
]
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "PyYAML>=6.0",
    "PySocks>=1.7.1",
    "reportlab>=4.0",
    "dnspython>=2.0.0",
    "cryptography>=41.0.0",
    "certifi>=2023.7.22",
    "websocket-client>=1.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/dexpie/keris"
Repository = "https://github.com/dexpie/keris"
"Bug Tracker" = "https://github.com/dexpie/keris/issues"

[project.scripts]
keris = "keris.__main__:main"

[tool.setuptools]
packages = ["keris", "keris.core", "keris.modules"]

[tool.setuptools.package-data]
keris = ["data/*.txt"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Fokus pada bug nyata (pyflakes) dan error syntax; biarkan style lain longgar.
select = ["F", "E9"]
ignore = ["F401"]